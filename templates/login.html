<!DOCTYPE html>
<html>
<head>
<title>Login - Network Troubleshooting Chatbot</title>

<style>

body{
font-family:Arial;
background:#0b0b0b;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
width:350px;
padding:30px;
background:#1a1a1a;
border-radius:10px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:5px;
}

button{
width:100%;
padding:10px;
background:#ff9800;
border:none;
border-radius:20px;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ffb74d;
}

a{
color:#ff9800;
text-decoration:none;
}

</style>
</head>

<body>

<div class="login-box">

<h2>Login</h2>

<form action="/login_user" method="POST">

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<p>Don't have an account? <a href="/register">Register</a></p>

</div>

</body>
</html>
